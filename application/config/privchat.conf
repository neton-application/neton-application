# module-cs 经 PrivChat service API 接入 IM，缺这份配置启动即失败
# （CsRuntimeBootstrap.buildServiceClient）。key 与 module-privchat 一致，
# 两者同装的部署共用一份。
[server]
service_api_base_url = "http://localhost:9090"
# 部署时换成真实的 service master key，勿把生产密钥提交进来
service_master_key = "your_service_master_key_here"
business_system_id = "kedao"
